<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ovine ECS Engine</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
  canvas { display: block; }
  #lobby { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); 
           background: rgba(15, 23, 42, 0.9); padding: 40px; border-radius: 12px;
           border: 1px solid #334155; text-align: center; color: white; z-index: 100;}
  .box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;}
  select, button { padding: 10px; font-size: 16px; border-radius: 6px; }
  button { cursor: pointer; background: #38bdf8; color: #04101f; font-weight: bold; border: none;}
  button:hover { background: #7dd3fc; }
  #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; color: white; 
         text-shadow: 1px 1px 2px black; font-weight: bold; }
  #telemetry-hud {
      display: none; position: absolute; top: 20px; right: 20px; width: 250px;
      background: rgba(15, 23, 42, 0.85); padding: 15px; border-radius: 8px;
      border: 1px solid #4ade80; backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.2); font-size: 13px; color: white;
  }
  #telemetry-hud h3 { margin: 0 0 10px 0; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 5px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="telemetry-hud"></div>
<div id="hud"></div>
<div id="lobby">
  <h1 style="color: #38bdf8; margin-top: 0;">OVINE ECS ENGINE</h1>
  <div class="box">
    <label>Player Role:</label>
    <select id="sel-player">
      <option value="HAMSTER">Hamster (Squeak Lure)</option>
      <option value="SHEEPDOG">Sheepdog (Bark Push)</option>
    </select>
    <label>Herd Target:</label>
    <select id="sel-herd">
      <option value="CAT">Cats (Curious, Skittish)</option>
      <option value="SHEEP">Sheep (Flocking, Fearful)</option>
    </select>
    <label>Adversary (Unimplemented):</label>
    <select id="sel-adv">
      <option value="NONE">None</option>
      <option value="BORDER_COLLIE">Border Collie (Competitive)</option>
      <option value="ALIEN">Alien UFO (Chaos)</option>
    </select>
  </div>
  <button id="btn-start">Initialize Simulation</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
